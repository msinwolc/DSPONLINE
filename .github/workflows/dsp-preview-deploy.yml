name: DSP Preview Deploy

on:
  push:
    branches:
      - feat/material-tray-extractor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsp-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # Push deploys require all five DSP_PREVIEW_* secrets and sync the preview site.
      - name: Deploy preview over SSH
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOST: ${{ secrets.DSP_PREVIEW_HOST }}
          DEPLOY_USER: ${{ secrets.DSP_PREVIEW_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DSP_PREVIEW_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DSP_PREVIEW_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DSP_PREVIEW_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Configure GitHub Actions secrets DSP_PREVIEW_HOST, DSP_PREVIEW_USER, DSP_PREVIEW_SSH_KEY, DSP_PREVIEW_KNOWN_HOSTS, and DSP_PREVIEW_PATH before deployment."
            exit 1
          fi
          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == *".."* || "$DEPLOY_PATH" == "/" ]]; then
            echo "::error::DSP_PREVIEW_PATH must be a safe absolute directory path."
            exit 1
          fi

          key_file="$RUNNER_TEMP/dsp-preview-deploy-key"
          known_hosts_file="$RUNNER_TEMP/dsp-preview-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          export RSYNC_RSH="ssh -i $key_file -p 22 -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts_file -o StrictHostKeyChecking=yes"
          rsync -az --delete dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
